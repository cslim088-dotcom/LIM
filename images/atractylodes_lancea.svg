<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="85%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </radialGradient>

    <!-- 창출 단면 내 회황갈색 그라디언트 -->
    <radialGradient id="lanceaSliceGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- 창출 울퉁불퉁 외피 그라디언트 -->
    <linearGradient id="lanceaBark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="60%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- 배경 트레이 -->
  <ellipse cx="400" cy="330" rx="330" ry="210" fill="url(#plateGrad)" filter="url(#dropShadow)" stroke="#57534e" stroke-width="3"/>
  <ellipse cx="400" cy="330" rx="310" ry="190" fill="none" stroke="#44403c" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- 타이틀 -->
  <text x="400" y="55" text-anchor="middle" fill="#D97706" font-family="'Noto Serif KR', serif" font-size="28" font-weight="700" letter-spacing="2">약재 사전 조사 : 창출 (蒼朮)</text>
  <text x="400" y="85" text-anchor="middle" fill="#A1A1AA" font-family="sans-serif" font-size="14" letter-spacing="1">Atractylodis Rhizoma | Atractylodes lancea (Thunb.) DC.</text>
  <line x1="250" y1="98" x2="550" y2="98" stroke="#D97706" stroke-width="1" opacity="0.4"/>

  <!-- 창출 약재 그래픽 (주황빛 유점 점콕콕 박힌 덩이줄기 절편들) -->
  <g filter="url(#dropShadow)">
    
    <!-- 창출 슬라이스 1 (중앙 메인 절편) -->
    <g transform="translate(360, 310) rotate(10)">
      <!-- 불규칙 둥근 덩이줄기 외피 -->
      <path d="M -90,-40 C -50,-80 50,-70 90,-30 C 120,10 100,70 60,90 C 10,100 -60,90 -90,50 C -110,10 -110,-20 -90,-40 Z" fill="url(#lanceaBark)" stroke="#292524" stroke-width="5"/>
      <!-- 황갈색 단면 -->
      <path d="M -80,-30 C -40,-70 40,-60 80,-25 C 105,10 90,60 50,80 C 10,90 -50,80 -80,42 C -95,10 -95,-15 -80,-30 Z" fill="url(#lanceaSliceGrad)" stroke="#B45309" stroke-width="2"/>
      
      <!-- 창출의 핵심 특징 : 단면 주황색/붉은색 유점(기름샘, 朱玉) 방사상 분포 -->
      <g fill="#EF4444" opacity="0.95">
        <circle cx="-50" cy="-20" r="3.5"/><circle cx="-25" cy="-40" r="4"/><circle cx="15" cy="-35" r="3"/>
        <circle cx="45" cy="-20" r="4.5"/><circle cx="60" cy="10" r="4"/><circle cx="40" cy="40" r="3.5"/>
        <circle cx="15" cy="55" r="4"/><circle cx="-25" cy="50" r="3.5"/><circle cx="-55" cy="30" r="4"/>
        <circle cx="-65" cy="5" r="3.5"/><circle cx="-10" cy="-10" r="3"/><circle cx="20" cy="15" r="3.5"/>
      </g>
      
      <!-- 주름 나뭇결선 -->
      <path d="M -30,-15 C 0,-25 30,-20 40,0 M -40,15 C -10,10 20,25 30,35" stroke="#78350F" stroke-width="1.5" fill="none" opacity="0.6"/>
    </g>

    <!-- 창출 슬라이스 2 (좌측 절편) -->
    <g transform="translate(230, 330) rotate(-25)">
      <path d="M -60,-30 C -30,-50 30,-45 60,-20 C 80,5 70,45 40,60 C 10,70 -40,60 -60,35 C -75,10 -75,-15 -60,-30 Z" fill="url(#lanceaBark)" stroke="#292524" stroke-width="4"/>
      <path d="M -52,-22 C -25,-40 25,-35 52,-15 C 70,5 60,38 32,50 C 8,60 -32,50 -50,28 C -63,8 -63,-10 -52,-22 Z" fill="url(#lanceaSliceGrad)" stroke="#B45309" stroke-width="1.5"/>
      <!-- 유점 -->
      <g fill="#F97316">
        <circle cx="-30" cy="-15" r="3"/><circle cx="0" cy="-25" r="3.5"/><circle cx="30" cy="-10" r="3"/>
        <circle cx="35" cy="15" r="3.5"/><circle cx="10" cy="30" r="3"/><circle cx="-25" cy="20" r="3.5"/>
      </g>
    </g>

    <!-- 창출 슬라이스 3 (우측 절편) -->
    <g transform="translate(510, 340) rotate(35)">
      <path d="M -55,-25 C -25,-45 25,-40 55,-15 C 75,10 65,45 35,55 C 5,65 -35,55 -55,30 Z" fill="url(#lanceaBark)" stroke="#292524" stroke-width="4"/>
      <path d="M -47,-18 C -20,-35 20,-30 47,-10 C 65,10 55,38 27,47 C 2,55 -27,47 -45,23 Z" fill="url(#lanceaSliceGrad)" stroke="#B45309" stroke-width="1.5"/>
      <g fill="#EF4444">
        <circle cx="-20" cy="-10" r="3"/><circle cx="10" cy="-20" r="3.5"/><circle cx="30" cy="5" r="3"/>
        <circle cx="15" cy="25" r="3.5"/><circle cx="-15" cy="15" r="3"/>
      </g>
    </g>

  </g>

  <!-- 약재 전문가 설명 캡션 뱃지 -->
  <rect x="150" y="480" width="500" height="75" rx="10" fill="#18181b" opacity="0.9" stroke="#D97706" stroke-width="1.5"/>
  <text x="400" y="508" text-anchor="middle" fill="#D97706" font-family="'Noto Sans KR', sans-serif" font-size="15" font-weight="700">★ 본초학 전문가 감수 포인트</text>
  <text x="400" y="533" text-anchor="middle" fill="#E4E4E7" font-family="'Noto Sans KR', sans-serif" font-size="13">창출은 마디 진 둥근 덩이줄기 절편 단면에 주황-붉은색 유점(기름샘)이 방사상으로 박혀있습니다.</text>
</svg>
