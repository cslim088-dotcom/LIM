<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="85%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </radialGradient>

    <!-- 갈근 백색~아이보리 큐브 단면 그라디언트 -->
    <linearGradient id="kudzuIvoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- 갈근 두꺼운 표피 그라디언트 -->
    <linearGradient id="kudzuBark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="50%" stop-color="#543A14" />
      <stop offset="100%" stop-color="#291A08" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- 배경 트레이 -->
  <ellipse cx="400" cy="330" rx="330" ry="210" fill="url(#plateGrad)" filter="url(#dropShadow)" stroke="#52525b" stroke-width="3"/>
  <ellipse cx="400" cy="330" rx="310" ry="190" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- 타이틀 -->
  <text x="400" y="55" text-anchor="middle" fill="#E2E8F0" font-family="'Noto Serif KR', serif" font-size="28" font-weight="700" letter-spacing="2">약재 사전 조사 : 갈근 (葛根 / 칡뿌리)</text>
  <text x="400" y="85" text-anchor="middle" fill="#A1A1AA" font-family="sans-serif" font-size="14" letter-spacing="1">Puerariae Radix | Pueraria lobata (Willd.) Ohwi</text>
  <line x1="250" y1="98" x2="550" y2="98" stroke="#CBD5E1" stroke-width="1" opacity="0.4"/>

  <!-- 갈근 약재 그래픽 (큐브 깍두기 도막 & 섬유질 세로 결) -->
  <g filter="url(#dropShadow)">
    
    <!-- 메인 사각 큐브 도막 1 (중앙) -->
    <g transform="translate(340, 260) rotate(-8)">
      <!-- 3D 큐브 앞면 -->
      <polygon points="0,0 90,-20 130,40 40,60" fill="url(#kudzuIvoryGrad)" stroke="#94A3B8" stroke-width="2"/>
      <!-- 3D 큐브 옆면 -->
      <polygon points="130,40 170,10 130,-40 90,-20" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
      <!-- 3D 큐브 윗면 -->
      <polygon points="0,0 40,-30 130,-40 90,-20" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>

      <!-- 핵심 특징: 뚜렷한 세로 결 섬유질 라인들 -->
      <path d="M 15,-3 L 48,52 M 30,-7 L 63,48 M 45,-10 L 78,44 M 60,-14 L 93,41 M 75,-17 L 108,38 M 90,-20 L 123,35" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,2" fill="none"/>
    </g>

    <!-- 사각 큐브 도막 2 (좌측) -->
    <g transform="translate(210, 310) rotate(15)">
      <polygon points="0,0 80,-15 110,35 30,50" fill="url(#kudzuIvoryGrad)" stroke="#94A3B8" stroke-width="1.5"/>
      <polygon points="110,35 145,10 115,-30 80,-15" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
      <polygon points="0,0 35,-25 115,-30 80,-15" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- 세로 섬유결 -->
      <path d="M 15,-3 L 40,45 M 35,-7 L 60,40 M 55,-10 L 80,36 M 75,-13 L 100,32" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,2" fill="none"/>
    </g>

    <!-- 사각 큐브 도막 3 (우측) -->
    <g transform="translate(480, 310) rotate(-20)">
      <polygon points="0,0 85,-18 120,38 35,55" fill="url(#kudzuIvoryGrad)" stroke="#94A3B8" stroke-width="1.5"/>
      <polygon points="120,38 155,12 120,-32 85,-18" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
      <polygon points="0,0 35,-25 120,-32 85,-18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- 세로 섬유결 -->
      <path d="M 15,-3 L 45,48 M 35,-7 L 65,42 M 55,-11 L 85,37 M 75,-15 L 105,32" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,2" fill="none"/>
    </g>

    <!-- 갈근 통 칡뿌리 갈색 껍질 조각 (배경) -->
    <g transform="translate(320, 390) rotate(5)">
      <path d="M -80,10 Q 0,-20 80,0 Q 120,20 160,10 Q 180,30 140,50 Q 50,60 -60,40 Z" fill="url(#kudzuBark)" stroke="#291A08" stroke-width="2.5"/>
      <path d="M -60,20 C 0,5 80,20 120,25" stroke="#854D0E" stroke-width="1.5" fill="none"/>
    </g>

  </g>

  <!-- 약재 전문가 설명 캡션 뱃지 -->
  <rect x="150" y="480" width="500" height="75" rx="10" fill="#18181b" opacity="0.9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="400" y="508" text-anchor="middle" fill="#E2E8F0" font-family="'Noto Sans KR', sans-serif" font-size="15" font-weight="700">★ 본초학 전문가 감수 포인트</text>
  <text x="400" y="533" text-anchor="middle" fill="#E4E4E7" font-family="'Noto Sans KR', sans-serif" font-size="13">갈근(칡뿌리)은 백색~아이보리색 사각형 큐브 도막 형태로 뚜렷한 세로 섬유질 결이 특징입니다.</text>
</svg>
