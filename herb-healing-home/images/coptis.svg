<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="85%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </radialGradient>

    <!-- 황련 주황/자황색 단면 그라디언트 -->
    <radialGradient id="coptisOrangeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </radialGradient>

    <!-- 황련 껍질 울퉁불퉁 갈색 그라디언트 -->
    <linearGradient id="coptisBark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="60%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1c0a00" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- 배경 트레이 -->
  <ellipse cx="400" cy="330" rx="330" ry="210" fill="url(#plateGrad)" filter="url(#dropShadow)" stroke="#57534e" stroke-width="3"/>
  <ellipse cx="400" cy="330" rx="310" ry="190" fill="none" stroke="#44403c" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- 타이틀 -->
  <text x="400" y="55" text-anchor="middle" fill="#F97316" font-family="'Noto Serif KR', serif" font-size="28" font-weight="700" letter-spacing="2">약재 사전 조사 : 황련 (黃連)</text>
  <text x="400" y="85" text-anchor="middle" fill="#A1A1AA" font-family="sans-serif" font-size="14" letter-spacing="1">Coptidis Rhizoma | Coptis japonica Makino</text>
  <line x1="250" y1="98" x2="550" y2="98" stroke="#EA580C" stroke-width="1" opacity="0.4"/>

  <!-- 황련 닭발형(鷄爪) 마디 뿌리줄기 그래픽 -->
  <g filter="url(#dropShadow)">
    
    <!-- 닭발 형태 굵은 마디 1 (중앙 꺾인 rhizome) -->
    <g transform="translate(350, 290)">
      <!-- 지그재그 마디 굵은 줄기 -->
      <path d="M -110,40 C -80,-30 -20,-40 20,-10 C 60,20 100,-20 140,20 C 160,40 120,80 80,60 C 40,40 -20,70 -70,80 Z" fill="url(#coptisBark)" stroke="#260e02" stroke-width="4"/>
      
      <!-- 울퉁불퉁한 수염뿌리 돌기 자국들 -->
      <circle cx="-60" cy="0" r="4" fill="#EA580C"/>
      <circle cx="-30" cy="-15" r="5" fill="#CA8A04"/>
      <circle cx="10" cy="5" r="4.5" fill="#EA580C"/>
      <circle cx="50" cy="-5" r="4" fill="#CA8A04"/>
      <circle cx="90" cy="25" r="5" fill="#EA580C"/>
      
      <!-- 마디 테두리 주름선 -->
      <path d="M -50,-15 C -40,15 -60,45 -60,45 M 0,-5 C 10,25 -10,55 -10,55 M 60,-5 C 70,20 50,50 50,50" stroke="#260e02" stroke-width="2.5" fill="none"/>

      <!-- 단면 자른 마디 (우측 붉은 황갈색 강렬한 단면) -->
      <ellipse cx="135" cy="28" rx="18" ry="26" fill="url(#coptisOrangeGrad)" stroke="#78350F" stroke-width="2"/>
      <ellipse cx="135" cy="28" rx="8" ry="12" fill="#FEF08A" opacity="0.8"/>
    </g>

    <!-- 닭발 분지 형태 2 (좌측 가지) -->
    <g transform="translate(240, 360) rotate(-40)">
      <path d="M -70,20 C -50,-20 0,-30 40,-10 C 70,10 60,50 20,40 C -10,30 -50,50 -70,20 Z" fill="url(#coptisBark)" stroke="#260e02" stroke-width="3"/>
      <circle cx="-20" cy="-5" r="4" fill="#EA580C"/>
      <circle cx="15" cy="5" r="4" fill="#CA8A04"/>
      <ellipse cx="-65" cy="20" rx="12" ry="18" fill="url(#coptisOrangeGrad)" stroke="#78350F" stroke-width="1.5"/>
    </g>

    <!-- 닭발 분지 형태 3 (우측 아래 마디) -->
    <g transform="translate(480, 370) rotate(30)">
      <path d="M -60,15 C -40,-25 10,-20 50,0 C 80,20 60,50 10,40 C -20,30 -40,40 -60,15 Z" fill="url(#coptisBark)" stroke="#260e02" stroke-width="3"/>
      <circle cx="0" cy="-5" r="4" fill="#EA580C"/>
      <circle cx="30" cy="10" r="4.5" fill="#CA8A04"/>
      <ellipse cx="50" cy="10" rx="14" ry="20" fill="url(#coptisOrangeGrad)" stroke="#78350F" stroke-width="1.5"/>
    </g>

    <!-- 수염뿌리 잔재 묘사 -->
    <path d="M 280,310 C 270,290 260,285 250,290 M 320,380 C 310,400 295,410 300,420 M 420,320 C 430,300 445,290 440,280 M 520,350 C 540,340 550,345 560,335" stroke="#78350F" stroke-width="1.5" fill="none"/>

  </g>

  <!-- 약재 전문가 설명 캡션 뱃지 -->
  <rect x="150" y="480" width="500" height="75" rx="10" fill="#18181b" opacity="0.9" stroke="#F97316" stroke-width="1.5"/>
  <text x="400" y="508" text-anchor="middle" fill="#F97316" font-family="'Noto Sans KR', sans-serif" font-size="15" font-weight="700">★ 본초학 전문가 감수 포인트</text>
  <text x="400" y="533" text-anchor="middle" fill="#E4E4E7" font-family="'Noto Sans KR', sans-serif" font-size="13">황련은 닭발(鷄爪) 모양의 울퉁불퉁 꺾인 결절성 마디와 강렬한 주황빛 자황색 단면이 특징입니다.</text>
</svg>
